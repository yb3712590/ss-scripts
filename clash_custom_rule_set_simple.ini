custom_proxy_group=🤖 AI备用`fallback`(新加坡|日本|美国|US-|JP-|DE-)`http://www.gstatic.com/generate_204`180,3,50
custom_proxy_group=⚡ 香港低延迟`select`[]香港（CN2）`(【亚洲】香港|\[赠\].*HK-)

