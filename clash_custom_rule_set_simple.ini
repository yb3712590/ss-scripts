;设置分组标志位
;主入口：日常默认使用不限量线路，需要低延迟时再手动切到香港 CN2。
custom_proxy_group=🚀 节点选择`select`[]♾️ 不限量线路`[]⚡ 香港低延迟`[]🚀 手动切换`[]DIRECT
custom_proxy_group=🚀 手动切换`select`.*

;能力线路池：不改变或删除任何节点，仅控制节点出现的位置。
custom_proxy_group=♾️ 不限量线路`fallback`[]洛杉矶（高速NF）`[]洛杉矶（TCP）`[]☁️ WARP自动`(\[赠\]|新加坡)`http://www.gstatic.com/generate_204`180,3,50
